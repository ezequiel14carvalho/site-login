<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="img">
               
            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a). Preencha abaixo para acessar sua conta. <br></p>

                <form action="login.php" method="post">
                    <div class="campo">
                        <label for="ilogin">E-mail:</label>
                        <input required type="email" name="login" id="ilogin" placeholder="Digite seu E-mail">

                        <label for="isenha"><br>Senha:</label>
                        <input required minlength="4" maxlength="10" type="password" name="senha" id="isenha" placeholder="Digite sua senha">
                    </div>

                    <div class="campo">
                        <input type="submit" value="Entrar">
                        
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>
</html>
